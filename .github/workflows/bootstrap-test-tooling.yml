name: Bootstrap Test Tooling

on:
  push:
    branches:
      - chore/add-tests-ci

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: chore/add-tests-ci

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm install --save-dev vitest @testing-library/react @testing-library/jest-dom @testing-library/user-event jsdom

      - name: Add test scripts
        run: |
          npm pkg set scripts.test="vitest"
          npm pkg set scripts.test:run="vitest run"

      - name: Verify protected route tests
        run: npm run test:run -- src/components/ProtectedRoute.test.tsx

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit."
            exit 0
          fi
          git commit -m "test: add Vitest and Testing Library dependencies"
          git push origin chore/add-tests-ci
